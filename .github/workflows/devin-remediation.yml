name: Devin Remediation (labeled issue trigger)

# Resilient, in-repo event source: when an issue is labeled `devin-fix`,
# start a Devin remediation session via the shared dispatcher CLI.
# This mirrors the FastAPI webhook path — both call app.cli dispatch.

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    if: github.event.label.name == 'devin-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator
        run: pip install .

      - name: Dispatch remediation session
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.REMEDIATION_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          python -m app.cli dispatch --issue ${{ github.event.issue.number }}

      - name: Upload run database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-db
          path: |
            remediation.db
            summary.md
          if-no-files-found: ignore
